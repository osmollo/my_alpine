name: Bump version for development branch

on:
  create:

permissions:
  contents: write

jobs:
  bump_version:
    if: github.event.ref_type == 'branch' && (startsWith(github.event.ref, 'feature/') || startsWith(github.event.ref, 'fix/'))
    name: Bump development version
    runs-on: ubuntu-latest
    steps:
    - name: Checkout new branch
      uses: actions/checkout@v3
      with:
        ref: ${{ github.event.ref }}
        fetch-depth: 0

    - name: Verify branch starts from develop
      run: |
        git fetch origin develop
        branch_root=$(git rev-list --reverse "origin/develop..HEAD" | head -n 1)
        test -n "$branch_root"
        git merge-base --is-ancestor "${branch_root}^" origin/develop

    - name: Bump version
      shell: bash
      env:
        branch_name: ${{ github.event.ref }}
      run: |
        version=$(jq -r '.version' release.json)
        if [[ "$version" =~ ^([0-9]+)\.([0-9]+)(\.([0-9]+))?_RC[0-9]+$ ]]; then
          major=${BASH_REMATCH[1]}
          minor=${BASH_REMATCH[2]}
          patch=${BASH_REMATCH[4]:-0}
        else
          echo "Unsupported version format: $version" >&2
          exit 1
        fi

        case "$branch_name" in
          feature/*)
            next_version="$major.$((minor + 1))_RC1"
            ;;
          fix/*)
            patch=${patch:-0}
            next_version="$major.$minor.$((patch + 1))_RC1"
            ;;
        esac

        jq --arg version "$next_version" '.version = $version' release.json > release.json.tmp
        mv release.json.tmp release.json
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add release.json
        git commit -m "Bump version to $next_version"
        git push origin "HEAD:${branch_name}"
