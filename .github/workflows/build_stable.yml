name: Publish stable image

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write

jobs:
  publish_stable:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'develop'
    name: Publish stable image
    runs-on: ubuntu-latest
    steps:
    - name: Checkout merged main branch
      uses: actions/checkout@v3
      with:
        ref: main

    - name: Read stable version
      id: version_info
      run: echo "version=$(jq -r '.version' release.json)" >> "$GITHUB_OUTPUT"

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USER }}
        password: ${{ secrets.DOCKERHUB_PASS }}

    - name: Build and publish stable image
      env:
        docker_image: osmollo/my_alpine
        docker_version: ${{ steps.version_info.outputs.version }}
      run: |
        docker build -t "$docker_image:$docker_version" .
        docker push "$docker_image:$docker_version"
        docker tag "$docker_image:$docker_version" "$docker_image:latest"
        docker push "$docker_image:latest"

    - name: Create GitHub stable release
      env:
        GH_TOKEN: ${{ github.token }}
        docker_image: osmollo/my_alpine
        docker_version: ${{ steps.version_info.outputs.version }}
      run: |
        cat > release-notes.md <<EOF
        ## Stable image

        Published Docker images:

        - \`$docker_image:$docker_version\`
        - \`$docker_image:latest\`

        ## Changes

        - Published after merging pull request #${{ github.event.pull_request.number }} from \`develop\` into \`main\`.
        - The \`latest\` tag now points to this stable release.
        EOF
        gh release create "$docker_version" \
          --target main \
          --title "Release $docker_version" \
          --notes-file release-notes.md
