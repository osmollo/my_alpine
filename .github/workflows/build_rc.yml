name: Build RC version
on:
  push:
    branches:
      - develop

jobs:
  build_image:
    name: Build docker image
    runs-on: ubuntu-latest
    steps:
    - name: checkout code
      uses: actions/checkout@v3

    - name: Read release.json
      uses: notiz-dev/github-action-json-property@release
      id: version_info
      with:
        path: 'release.json'
        prop_path: 'version'

    - name: Show version number
      run: echo "Version is ${{ steps.version_info.outputs.prop }}"

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USER }}
        password: ${{ secrets.DOCKERHUB_PASS }}

    - name: Build, tag, and push image to Docker Hub
      env:
        docker_user: osmollo
        docker_image: my_alpine
        docker_version: ${{ github.sha }}
      run: |
        docker_version=${docker_version::7}
        docker build -t $docker_user/$docker_image:$docker_version .
        docker push $docker_user/$docker_image:$docker_version
        docker tag $docker_user/$docker_image:$docker_version $docker_user/$docker_image:latest
        docker push $docker_user/$docker_image:latest

    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        docker_user: osmollo
        docker_image: my_alpine
        docker_version: ${{ github.sha }}
      run: |
        docker_version=${docker_version::7}
        release_notes=$(cat <<EOF
        ## Development image

        Published Docker image: \`$docker_user/$docker_image:$docker_version\`

        ## Changes

        - Built from the merge commit on \`develop\`.
        - Published to Docker Hub with the short commit SHA tag.
        - Updated \`$docker_user/$docker_image:latest\` to this development build.

        ## Traceability

        - Commit: $GITHUB_SHA
        EOF
        )
        gh release create "$docker_version" \
          --target "$GITHUB_SHA" \
          --title "Development build $docker_version" \
          --notes "$release_notes"
