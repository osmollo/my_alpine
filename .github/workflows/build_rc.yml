name: Publish beta image

on:
  pull_request:
    branches:
      - develop
    types:
      - closed

permissions:
  contents: write

jobs:
  publish_beta:
    if: github.event.pull_request.merged == true
    name: Publish beta image
    runs-on: ubuntu-latest
    steps:
    - name: Checkout merged develop branch
      uses: actions/checkout@v3
      with:
        ref: develop

    - name: Read beta version
      id: version_info
      run: echo "version=$(jq -r '.version' release.json)" >> "$GITHUB_OUTPUT"

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USER }}
        password: ${{ secrets.DOCKERHUB_PASS }}

    - name: Build and publish beta image
      env:
        docker_image: osmollo/my_alpine
        docker_version: ${{ steps.version_info.outputs.version }}
      run: |
        docker build -t "$docker_image:$docker_version" .
        docker push "$docker_image:$docker_version"

    - name: Create GitHub beta release
      env:
        GH_TOKEN: ${{ github.token }}
        docker_image: osmollo/my_alpine
        docker_version: ${{ steps.version_info.outputs.version }}
      run: |
        cat > release-notes.md <<EOF
        ## Beta image

        Published Docker image: \`$docker_image:$docker_version\`

        ## Changes

        - Published after merging pull request #${{ github.event.pull_request.number }} into \`develop\`.
        - Built from the merged \`develop\` branch.
        - This beta does not update the \`latest\` image tag.
        EOF
        gh release create "$docker_version" \
          --target develop \
          --prerelease \
          --title "Beta $docker_version" \
          --notes-file release-notes.md
