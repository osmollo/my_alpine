add_newline = false
format = "[ DOCKER ](bold white on blue) [](blue) $os$directory$git_branch$git_status$python$line_break$character"

[os]
disabled = false
format = "[ $symbol ](bold cyan)"

[os.symbols]
Alpine = ""

[directory]
style = "bold white"
format = "[ $path ]($style)"
truncation_length = 3
truncate_to_repo = false

[git_branch]
symbol = " "
style = "bold purple"
format = "[ $symbol$branch ]($style)"

[git_status]
style = "bold yellow"
format = "[($all_status$ahead_behind )]($style)"

[python]
symbol = " "
style = "bold yellow"
format = "[ $symbol$version ]($style)"

[character]
success_symbol = "[❯](bold green) "
error_symbol = "[❯](bold red) "
